<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768" role="img" aria-labelledby="title desc">
  <title id="title">活在当下</title>
  <desc id="desc">暮色与晨光交汇的抽象景象，中央一枚安静的光点象征此刻，远处层层轨迹逐渐消散。</desc>
  <defs>
    <linearGradient id="sky" x1="96" y1="48" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18263a"/>
      <stop offset=".46" stop-color="#566f78"/>
      <stop offset="1" stop-color="#d6b98c"/>
    </linearGradient>
    <radialGradient id="stillness" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fff7d6" stop-opacity=".96"/>
      <stop offset=".18" stop-color="#f5d79d" stop-opacity=".54"/>
      <stop offset=".62" stop-color="#e3b778" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e3b778" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="768" y1="450" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233c4c" stop-opacity=".48"/>
      <stop offset="1" stop-color="#101d2d" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="pathFade" x1="238" y1="0" x2="1298" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dce6df" stop-opacity="0"/>
      <stop offset=".28" stop-color="#e4ece2" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#fff3c5" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#f2dfbd" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f2dfbd" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1536" height="768" fill="url(#sky)"/>
  <circle cx="768" cy="374" r="292" fill="url(#stillness)"/>

  <g fill="none" stroke="url(#pathFade)" stroke-linecap="round">
    <path d="M126 330C360 286 514 444 768 374s408-66 642-11" stroke-width="2" opacity=".46"/>
    <path d="M84 374c248-90 446 81 684 0 244-83 451 74 704 1" stroke-width="1.5" opacity=".62"/>
    <path d="M168 421c214-48 382 37 600-47 213-82 393 54 600 18" stroke-width="1" opacity=".38"/>
  </g>

  <g fill="#e9eee8">
    <circle cx="297" cy="300" r="2.2" opacity=".18"/>
    <circle cx="418" cy="407" r="1.7" opacity=".28"/>
    <circle cx="535" cy="338" r="1.5" opacity=".34"/>
    <circle cx="1004" cy="348" r="1.5" opacity=".34"/>
    <circle cx="1125" cy="425" r="1.8" opacity=".25"/>
    <circle cx="1261" cy="322" r="2.2" opacity=".16"/>
  </g>

  <path d="M0 490c194-42 319-31 484 8 166 39 332 32 489-12 164-46 341-43 563 4v278H0Z" fill="url(#water)"/>
  <g fill="none" stroke="#d5d9cf" stroke-linecap="round">
    <path d="M332 551c176 20 279 14 436-5 158-20 282-23 448-1" stroke-width="2" opacity=".11"/>
    <path d="M449 608c124 13 215 9 319-4 108-14 197-16 322-3" stroke-width="1.5" opacity=".08"/>
    <path d="M568 664c83 8 139 6 200-2 64-8 118-8 202-1" stroke-width="1" opacity=".06"/>
  </g>

  <circle cx="768" cy="374" r="30" fill="#f6dca1" opacity=".22" filter="url(#softGlow)"/>
  <circle cx="768" cy="374" r="8" fill="#fff8dd"/>
  <circle cx="768" cy="374" r="2.6" fill="#fffef5"/>

  <rect width="1536" height="768" filter="url(#grain)" opacity=".34"/>
</svg>
